name: CI

on:
  push:
    branches: [main, develop, staging, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql://omnia:omnia_dev_password@localhost:5432/omnia_platform
  PAYLOAD_SECRET: ci-test-secret-minimum-32-characters-long
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnia
          POSTGRES_PASSWORD: omnia_dev_password
          POSTGRES_DB: omnia_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
