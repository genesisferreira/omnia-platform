name: CI

on:
  push:
    branches: [main, develop, staging, 'feature/**', 'release/**']
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql://omnia:omnia_dev_password@localhost:5432/omnia_platform
  PAYLOAD_SECRET: ci-test-secret-minimum-32-characters-long
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_FROM: ci@omnia.local
  OMNIA_INTERNAL_API_SECRET: ci-internal-api-secret-minimum-32-characters
  OMNIA_SMTP_ALLOW_BUILD: '1'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Parity with Next build: generated Payload types make relationship/select/json
      # mismatches fail here instead of only in `next build` typecheck (R0.3).
      - name: Generate Payload types
        run: pnpm --filter @omnia/admin generate:types

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: AI auth ordering (Portal BFF)
        run: pnpm --filter @omnia/web test:ai-auth-ordering

      - name: EPIC 16 AI context resolution
        run: pnpm --filter @omnia/web test:epic16-ai-context

      - name: EPIC 16 portal redirect
        run: pnpm --filter @omnia/admin test:epic16-portal-redirect

      - name: Public origin / auth redirect contracts
        run: pnpm --filter @omnia/shared test:public-origin

      - name: Public companies contract tests
        run: pnpm --filter @omnia/admin test:public-companies

      - name: Holding companies seed invariants
        run: pnpm --filter @omnia/admin test:holding-companies-seed

      - name: Holding home exclusive seed
        run: pnpm --filter @omnia/admin test:seed-holding-home

      - name: Holding institutional pages seed
        run: pnpm --filter @omnia/admin test:seed-holding-institutional-pages

      - name: Holding blog seed
        run: pnpm --filter @omnia/admin test:seed-holding-blog

      - name: Holding home institutional upgrade
        run: pnpm --filter @omnia/admin test:upgrade-holding-home

      - name: Public page contracts
        run: pnpm --filter @omnia/shared test:public-page-contracts

      - name: Public post contracts
        run: pnpm --filter @omnia/shared test:public-post-contracts

      - name: Public page endpoint and Pages rules
        run: pnpm --filter @omnia/admin test:public-page

      - name: Public posts endpoint rules
        run: pnpm --filter @omnia/admin test:public-posts

      - name: Portal SEO contracts
        run: pnpm --filter @omnia/web test:seo

      - name: Portal blog SEO contracts
        run: pnpm --filter @omnia/web test:seo-blog

      - name: SMTP config contracts
        run: pnpm --filter @omnia/admin test:smtp-auth

      - name: Neurofrigo auth/ACL contracts
        run: pnpm --filter @omnia/admin test:neurofrigo-auth-acl

      - name: Retrieval ACL contracts
        run: pnpm --filter @omnia/retrieval test

      - name: EPIC 17 Knowledge Governance
        run: pnpm --filter @omnia/knowledge-governance test

      - name: Adaptive Learning unit tests
        run: pnpm --filter @omnia/adaptive-learning test

      - name: Student Intelligence unit tests
        run: pnpm --filter @omnia/student-intelligence test

      - name: LMS Core + product completion ACL
        run: pnpm --filter @omnia/admin test:lms-core && pnpm --filter @omnia/admin test:lms-product-completion

      - name: Media staticDir resolution
        run: pnpm --filter @omnia/admin test:media-static-dir

      - name: Media binary ACL policy
        run: pnpm --filter @omnia/admin test:media-acl

      - name: Intelligent Learning System V1
        run: pnpm --filter @omnia/intelligent-learning test && pnpm --filter @omnia/admin test:intelligent-learning

      - name: Assessment engine native grade
        run: pnpm --filter @omnia/assessment-engine test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnia
          POSTGRES_PASSWORD: omnia_dev_password
          POSTGRES_DB: omnia_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fresh Payload migrations + Pages schema
        run: pnpm --filter @omnia/admin test:pages-migration-db

      - name: Generate Payload types
        run: pnpm --filter @omnia/admin generate:types

      - name: Generate Payload importmap
        env:
          DOCKER_BUILD: 'true'
        run: pnpm --filter @omnia/admin generate:importmap

      - name: Build Admin (isolated)
        env:
          DOCKER_BUILD: 'true'
        run: unset SMTP_HOST SMTP_PORT SMTP_FROM SMTP_USER SMTP_PASS && pnpm --filter @omnia/admin build

      - name: Build Web (isolated)
        env:
          DOCKER_BUILD: 'true'
        run: unset SMTP_HOST SMTP_PORT SMTP_FROM SMTP_USER SMTP_PASS && pnpm --filter @omnia/web build

      - name: Build monorepo
        env:
          DOCKER_BUILD: 'true'
        run: unset SMTP_HOST SMTP_PORT SMTP_FROM SMTP_USER SMTP_PASS && pnpm build
